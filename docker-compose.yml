services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Host and container path must match — see DooD note in api/jobs.py.
      - JOB_OUTPUT_DIR=${PWD}/backend/media/jobs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/backend/media/jobs:${PWD}/backend/media/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
